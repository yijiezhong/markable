name: 缺陷报告
description: 渲染、导出、界面等行为不符合预期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，避免重复。渲染类问题请附**最小 Markdown 片段**。
  - type: input
    id: version
    attributes:
      label: Markable 版本
      description: 「关于 Markable」里的版本号
      placeholder: 1.5.2 (202610251015)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: macOS 15.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …md
        2. 点击 …
        3. 看到 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图/录屏更好
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: 最小 Markdown 片段（渲染类问题）
      render: markdown
